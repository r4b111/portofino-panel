name = "portofino-orders-prod"
main = "src/index.ts"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]

[vars]
STOREFRONT_ORIGIN = "https://claro-panel-educativo-e41.r4b111.chatgpt.site"

[[d1_databases]]
binding = "DB"
database_name = "portofino-orders-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ORDER_ROOMS"
class_name = "OrderRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrderRoom"]

[triggers]
crons = ["0 * * * *"]

[env.production]
name = "portofino-orders"

[env.production.triggers]
crons = ["0 * * * *"]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["OrderRoom"]

[env.production.vars]
STOREFRONT_ORIGIN = "https://claro-panel-educativo-e41.r4b111.chatgpt.site"

[[env.production.d1_databases]]
binding = "DB"
database_name = "portofino"
database_id = "f05fbc67-1665-4f11-8fa6-abbdbd33949d"
migrations_dir = "migrations"

[[env.production.durable_objects.bindings]]
name = "ORDER_ROOMS"
class_name = "OrderRoom"
